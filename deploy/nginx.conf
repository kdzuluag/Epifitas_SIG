# Plantilla NO probada en este entorno (nginx + oauth2-proxy delante de la app Shiny).
# La app confía en la identidad SOLO si llega X-EPIG-Proxy-Token con el secreto compartido (EPIG_PROXY_TOKEN).
# El proxy debe BORRAR cualquier X-Forwarded-User enviado por el cliente y fijar el suyo.

limit_req_zone $binary_remote_addr zone=epig_req:10m rate=10r/s;

map $http_upgrade $connection_upgrade { default upgrade; '' close; }

server {
  listen 443 ssl http2;
  server_name app.epigdatabase.org;
  # ssl_certificate /etc/letsencrypt/live/app.epigdatabase.org/fullchain.pem;
  # ssl_certificate_key /etc/letsencrypt/live/app.epigdatabase.org/privkey.pem;

  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://server.arcgisonline.com https://*.tile.opentopomap.org; connect-src 'self' wss:; frame-ancestors 'self'" always;

  location /oauth2/ { proxy_pass http://127.0.0.1:4180; }
  location = /oauth2/auth { internal; proxy_pass http://127.0.0.1:4180; }

  location / {
    auth_request /oauth2/auth;
    error_page 401 = /oauth2/sign_in;
    auth_request_set $epig_user $upstream_http_x_auth_request_user;

    limit_req zone=epig_req burst=40 nodelay;

    proxy_set_header X-Forwarded-User $epig_user;                 # sobrescribe lo que envíe el cliente
    proxy_set_header X-EPIG-Proxy-Token "CAMBIAR_POR_EL_TOKEN";   # = EPIG_PROXY_TOKEN
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_http_version 1.1;
    proxy_read_timeout 600s;
    proxy_pass http://127.0.0.1:3838;
  }
}
